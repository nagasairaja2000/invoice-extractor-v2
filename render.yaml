services:
  - type: web
    name: invoice-extractor-v2
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.8-flash
      - key: ENABLE_GEMINI_VISION_FALLBACK
        value: true
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
